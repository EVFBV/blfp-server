  @keyframes floatIn { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes hover { from { transform: translateY(0); } to { transform: translateY(-8px); } }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .head img { width: 46px; height: 46px; border-radius: 12px; }
  .head h1 { font-size: 1.25rem; letter-spacing: .04em; }
  .head .ver { font-size: .75rem; color: #8b8b94; margin-top: 3px; }
  .desc { color: #8b8b94; font-size: .85rem; line-height: 1.7; margin: 10px 0 22px; }
  .dl-list { display: flex; flex-direction: column; gap: 12px; }

  .dl-item .meta b { display: block; font-size: .92rem; }
  .dl-item .meta span { font-size: .74rem; color: #8b8b94; }
  .dl-item .arrow { color: #1e4fd8; font-weight: 700; }
  .dl-item.disabled { opacity: .45; pointer-events: none; }
  .foot { margin-top: 20px; text-align: center; font-size: .74rem; color: #55555c; }
  .foot a { color: #4d7dff; text-decoration: none; }
</style>
</head>
<body>
  <div class="float-card">
    <div class="head">
      <img src="/BLFP-Logo.svg" alt="BLFP">
      <div>

<script>
(async () => {
  try {
    const res = await fetch('/api/settings/public');
    const s = await res.json();
    if (s.site_title) document.getElementById('site-title').textContent = s.site_title;
    if (s.latest_version) document.getElementById('ver').textContent = '最新版本 v' + s.latest_version + ' · 全平台客户端下载';
    const map = { 'dl-win': s.downloads && s.downloads.win, 'dl-linux': s.downloads && s.downloads.linux, 'dl-macos': s.downloads && s.downloads.macos };
    for (const [id, url] of Object.entries(map)) {
      const el = document.getElementById(id);
      if (url) el.href = url; else el.classList.add('disabled');
    }
  } catch (e) {
    document.getElementById('ver').textContent = '加载下载链接失败，请稍后再试';
  }
})();
</script>

</html>
